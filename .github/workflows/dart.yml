name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK attendu par Gradle/AGP. Le runner "ubuntu-latest" fournit
      #    désormais un JDK 25 que Gradle 8.14 refuse ("What went wrong: 25.0.5").
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Installation Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      # 4. Dépendances
      - name: Install dependencies
        run: flutter pub get

      # 5. Analyse
      - name: Analyze code
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1
          code=$?
          cat /tmp/analyze.txt
          if [ $code -ne 0 ]; then
            cp /tmp/analyze.txt analyze-report.txt
            git config user.name "peria-ci"
            git config user.email "ci@peria.app"
            git add analyze-report.txt
            git commit -m "ci: analyze report" || true
            git push || true
          fi
          exit $code

      # 6. Tests
      - name: Run tests
        run: flutter test

      # 7. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Build AAB (Play Store)
      - name: Build App Bundle
        run: flutter build appbundle --release

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 10. Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
