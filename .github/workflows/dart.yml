name: Flutter CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Le job de release crée un tag et une Release GitHub : il lui faut les droits
# d'écriture sur le contenu du dépôt.
permissions:
  contents: write

# Deux poussées rapprochées sur une PR annulent la première ; une poussée sur
# main n'est jamais annulée pour ne pas interrompre une release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.41.7'

jobs:
  # ===========================================================================
  # Android : analyse, tests, APK et AAB
  # ===========================================================================
  android:
    name: Android (analyse, tests, APK, AAB)
    runs-on: ubuntu-latest

    # `signed` pilote la publication : tant que le keystore de release n'est pas
    # installé, l'APK est signé avec la clé de debug du runner et ne peut
    # remplacer aucune installation. Une telle archive ne doit pas devenir une
    # release officielle.
    outputs:
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK attendu par Gradle/AGP. Le runner "ubuntu-latest" fournit
      #    désormais un JDK 25 que Gradle 8.14 refuse ("What went wrong: 25.0.5").
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Installation Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 4. Dépendances
      - name: Install dependencies
        run: flutter pub get

      # 5. Analyse
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 6. Tests
      - name: Run tests
        run: flutter test

      # 6bis. Signature de release. Le keystore arrive par le secret
      #        ANDROID_KEYSTORE_BASE64 ; sans lui, on compile avec la clé de
      #        debug et l'APK ne remplace pas une installation signée autrement.
      #        Procédure complète : docs/CI_CD.md, section « Signature Android ».
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signature de release absente::ANDROID_KEYSTORE_BASE64 n'est pas defini : l'APK est signe avec la cle de debug du runner. Il ne remplacera pas une installation existante et aucune release officielle ne sera publiee. Procedure : docs/SIGNATURE_RELEASE.md."
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > android/keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Keystore de release installe ($(wc -c < android/keystore/release.jks) octets)."

      # 7. Build APK
      # Le versionCode doit augmenter a chaque publication, sinon le Play Store
      # refuse l'envoi et les utilisateurs ne voient pas la mise a jour. Le
      # numero de run est monotone : il fait un versionCode unique par build.
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # 8. Build AAB (Play Store)
      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      # 8bis. Empreinte du certificat qui a signé l'APK : c'est la valeur à
      #       comparer quand Android refuse une mise à jour.
      - name: Print signing certificate
        run: |
          set -uo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$APK" ]; then echo "APK introuvable : $APK"; exit 0; fi
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${APKSIGNER}" ]; then
            "$APKSIGNER" verify --print-certs "$APK" || true
          else
            unzip -p "$APK" 'META-INF/*.RSA' > /tmp/cert.rsa && keytool -printcert -file /tmp/cert.rsa || true
          fi

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 10. Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ===========================================================================
  # iOS : compilation sans signature (les certificats Apple ne sont pas dans le
  # dépôt). Le .app obtenu sert à valider la compilation ; il n'est pas
  # installable tel quel sur un appareil.
  # ===========================================================================
  ios:
    name: iOS (build sans signature)
    runs-on: macos-latest

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installation Flutter (CocoaPods est déjà présent sur les runners macOS)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 3. Dépendances
      - name: Install dependencies
        run: flutter pub get

      # 4. Binaires iOS (accélère le premier build)
      - name: Precache iOS artifacts
        run: flutter precache --ios

      # 5. Build iOS sans signature
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # 6. Archive du .app, avec la version du pubspec dans le nom
      - name: Package Runner.app
        id: package
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd build/ios/iphoneos
          zip -qry "peria-ios-$VERSION.zip" Runner.app
          ls -lh "peria-ios-$VERSION.zip"

      # 7. Upload de l'archive iOS
      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: build/ios/iphoneos/peria-ios-${{ steps.package.outputs.version }}.zip

  # ===========================================================================
  # Release : uniquement sur un push (direct ou merge d'une PR) vers main.
  # Le numéro vient de `version:` dans pubspec.yaml ; le tag reprend la version
  # complète, par exemple v1.0.0+1. Relancer le workflow met à jour la release
  # existante au lieu d'échouer.
  # ===========================================================================
  release:
    name: Release automatique
    needs: [ android, ios ]
    # Rien n'est publie tant que l'APK n'est pas signé avec la clé de release :
    # une archive signée par la clé de debug du runner ne peut être installée
    # par-dessus une version existante.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest

    steps:
      # 1. Historique complet : nécessaire pour les notes générées et les tags
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Récupération des binaires des deux jobs de build
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 3. Préparation des fichiers de la release
      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          # `version:` reste la version lisible ; le numéro de run identifie le
          # build. Deux publications de la même version ne s'écrasent donc pas :
          # chaque mise à jour garde son APK, et le tag ne se confond pas avec
          # celui d'un build précédent.
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          BUILD="$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-b$BUILD" >> "$GITHUB_OUTPUT"

          mkdir -p release
          cp dist/app-release.apk "release/peria-$VERSION-b$BUILD.apk"
          cp dist/app-release.aab "release/peria-$VERSION-b$BUILD.aab"
          cp "dist/peria-ios-$VERSION.zip" "release/peria-$VERSION-b$BUILD-ios.zip"
          ls -lh release

      # 4. Tag + Release (création, ou mise à jour si le tag existe déjà)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.assets.outputs.version }}
          BUILD: ${{ steps.assets.outputs.build }}
        run: |
          set -euo pipefail
          TITLE="Peria $VERSION (build $BUILD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" release/* \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
